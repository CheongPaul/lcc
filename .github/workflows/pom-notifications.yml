name: Send new match POM notifications
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['firebase/pom-test-request.json']
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: lcc-pom-notifications
  cancel-in-progress: false
jobs:
  notify:
    # Enable only after Firebase Auth, Firestore rules and Google OIDC have been configured.
    if: vars.POM_PUSH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test notification logic
        run: node --test tests/pom-notifications.test.mjs tests/pom-test-send.test.mjs tests/schedule-notifications.test.mjs
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/76567286678/locations/global/workloadIdentityPools/lcc-github/providers/github
          service_account: lcc-pom-sender@lccstats.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - name: Check completed matches and send new POMs
        if: github.event_name != 'push'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/send-pom-notifications.mjs
      - name: Check next match schedule and send opted-in alerts
        if: always() && github.event_name != 'push' && steps.auth.outcome == 'success'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/send-schedule-notifications.mjs
      - name: Send explicitly requested one-time preview to a single device
        if: github.event_name == 'push'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/send-pom-test.mjs
