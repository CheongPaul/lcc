<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1014"><title>LCC · Offline</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#0c1014;color:#ecf1f4;font:16px system-ui,sans-serif}main{max-width:440px;padding:32px;background:#13191e;border:1px solid #263038;border-radius:16px}.brand{color:#c59c2d;letter-spacing:5px;font-size:38px;font-weight:800}h1{font-size:24px}p{color:#a9b5bf;line-height:1.7}button{border:1px solid #3b82f6;background:#171e24;color:#69bcff;padding:13px 20px;border-radius:8px;font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #22d3ee;outline-offset:4px}</style></head>
<body><main><div class="brand">LCC</div><h1 id="title">You’re offline</h1><p id="message">Connect to the internet to load LCC and the latest season statistics. Your current page will reopen when you reconnect.</p><button type="button" id="retry">Try again</button></main><script>
try{if(localStorage.getItem('lcc-language')==='ko'){document.documentElement.lang='ko';document.title='LCC · 오프라인';document.getElementById('title').textContent='인터넷 연결이 필요해요';document.getElementById('message').textContent='LCC와 최신 시즌 기록을 불러오려면 인터넷에 연결해 주세요. 다시 연결되면 보던 페이지를 엽니다.';document.getElementById('retry').textContent='다시 시도';}}catch{}
document.getElementById('retry').addEventListener('click',()=>location.reload());addEventListener('online',()=>location.reload(),{once:true});
</script></body></html>
